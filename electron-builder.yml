appId: com.slime.app
productName: Slime
npmRebuild: false
directories:
  buildResources: build
  output: dist
files:
  - "!**/.claude/*"
  - "!**/.github/*"
  - "!src/*"
  - "!test/*"
  - "!docs/*"
  - "!**/{.DS_Store,Thumbs.db}"
extraResources:
  - build/icon.png
asarUnpack:
  - "node_modules/better-sqlite3/**"
mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - dmg
    - zip
